# Capability profile: Go module proxy (anonymous, read-only).
#
# Replaces the go_modules block that was in policies/default.yaml (plan 0014).
# No credential — a provider of this type can be created with no credential
# value (openshell-providers/src/profiles.rs allows_empty_provider_credentials).
#
# Import:
#   openshell -g <gateway> profile lint   --file provider-profiles/go-modules.yaml
#   openshell -g <gateway> profile import --file provider-profiles/go-modules.yaml --global
#
# Create the provider (credential-less):
#   openshell -g <gateway> provider create --name ro-go_modules \
#       --type go-modules --global-profile
#
# Attach to: sop-improve, image-vuln-check, implement-ticket, pmr-action-item,
# and interactive sessions. See docs/hypershell-providers.md.
#
# Go toolchain child-process note (plan 0014 §4c):
# With GODEBUG=gotoolchainexec=0 set in the image, go 1.24.x (go-toolset)
# starts a newer downloaded toolchain as a child rather than exec-ing it.
# The process tree becomes /usr/bin/go → …/toolchain@…/bin/go → compile/test.
# Because OpenShell matches binaries by ancestry, this profile's
# binaries: [/usr/bin/go] covers every module and toolchain fetch in that tree.
#
# UNVERIFIED: the storage.googleapis.com bucket path below comes from reading
# proxy.golang.org redirect documentation, not from a live `go mod download -x`
# trace in this sandbox. Capture a real redirect and confirm the bucket name
# before shipping this profile to production. If the bucket differs, update the
# path rule below and re-import on all gateways.

id: go-modules
display_name: Go module proxy (anonymous)
description: Go module proxy, checksum database, and GCS redirect (anonymous, read-only)
category: data
endpoints:
  - host: proxy.golang.org
    port: 443
    protocol: rest
    access: read-only
    enforcement: enforce
  - host: sum.golang.org
    port: 443
    protocol: rest
    access: read-only
    enforcement: enforce
  # pkg.go.dev is a documentation site; go itself does not fetch it. Keep only
  # if Feature 0 access logs show /usr/bin/go actually reaching it; otherwise
  # drop it and let humans browse it through the redhat-docs-style WebFetch route.
  - host: pkg.go.dev
    port: 443
    protocol: rest
    access: read-only
    enforcement: enforce
  # proxy.golang.org redirects module zip content to GCS. Without this endpoint
  # `go get`/`go mod download`/`go build` fail with a proxy 403 even though
  # proxy.golang.org is reachable. Path-scoped to the proxy bucket; other GCS
  # buckets (including attacker-owned ones) are denied. BUCKET NAME UNVERIFIED:
  # capture from `go mod download -x` and also from a toolchain download before
  # shipping.
  - host: storage.googleapis.com
    port: 443
    protocol: rest
    enforcement: enforce
    rules:
      - allow: { method: GET, path: "/proxy-golang-org-prod/**" }
      - allow: { method: HEAD, path: "/proxy-golang-org-prod/**" }
# /usr/bin/go is a symlink; OpenShell matches the kernel-resolved target.
# Verified with `readlink -f /usr/bin/go` in rosa-agent-pr130-v3:
#   /usr/bin/go → /usr/lib/golang/bin/go
binaries: [/usr/lib/golang/bin/go]
inference_capable: false
