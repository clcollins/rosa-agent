version: 1
# Filesystem policy: baseline read-only paths must be declared explicitly when
# network_policies is empty. The supervisor's enrich_proto_baseline_paths only
# runs when at least one network policy exists (lib.rs:1743); with an empty map
# the policy is used as-is. Without these paths Landlock blocks /usr/bin,
# /lib64/ld-linux-*, /etc and the main process cannot execve.
# /dev/null must be explicitly writable or bash login shells fail silently
# (Landlock blocks /etc/profile redirections).
filesystem_policy:
  include_workdir: true
  read_only:
    - /bin
    - /usr
    - /lib
    - /etc
    - /app
    - /var/log
    - /proc
    - /dev/urandom
  read_write:
    - /tmp
    - /dev/null

# Deliberately empty. A sandbox reaches nothing unless a provider is attached.
# Grants live in provider-profiles/ so each one is attached per sandbox, named
# in `policy get --full` as _provider_<name>, and removable without an image
# rebuild. Do not add rules here; add or attach a profile instead.
#
# Previous rules and their replacements (plan 0014):
#   anthropic_api      → not restored. Claude Code runs on Vertex
#                        (CLAUDE_CODE_USE_VERTEX=1); WebSearch runs as a Vertex
#                        server tool. skipWebFetchPreflight=true in settings.json
#                        removes the only remaining reason to reach api.anthropic.com.
#   gitlab_cee         → provider-profiles/gitlab-cee.yaml (credentialed, staged:
#                        authored now, provider enabled once host is reachable).
#   go_modules         → provider-profiles/go-modules.yaml, provider ro-go_modules.
#   quay_registry,     → provider-profiles/image-inspect.yaml, provider
#   redhat_registry,     ro-image_inspect.
#   s3_blob_storage
#   redhat_errata      → provider-profiles/redhat-errata.yaml, provider
#                        ro-redhat_errata.
#   prow, codecov,     → provider-profiles/ci-pipelines.yaml, provider
#   github_actions,      ro-ci_pipelines.
#   github_assets
#   redhat_docs        → provider-profiles/redhat-docs.yaml, provider
#                        ro-redhat_docs.
#   konflux            → provider-profiles/konflux.yaml, provider ro-konflux.
#
# NOTE: Jira egress is intentionally NOT in this baked policy. With
# providers_v2_enabled=true the atlassian-jira provider profile composes its
# own endpoints with write method/path enforcement. A coarse read-write block
# here would union over — and defeat — that restriction. Attach the jira
# provider to grant Jira access; do not add it here.
# NOTE: PagerDuty egress is intentionally NOT in this baked policy, for the
# same reason as Jira above.
# NOTE: GitHub egress is intentionally NOT in this baked policy. See
# provider-profiles/github.yaml. A sandbox created WITHOUT that provider
# attached has no GitHub egress at all.
# NOTE: Vertex AI egress is intentionally NOT in this baked policy. See
# provider-profiles/google-vertex-ai.yaml.
network_policies: {}
