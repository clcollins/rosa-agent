# The gateway rosa-agent's scheduled work connects to.
#
# Placement, not pinning. The gateway declares the *kind* of cluster it wants
# as capability-label selectors rather than a cluster_id; the api-server
# resolves them to a concrete ManagedCluster and assigns cluster_id itself.
# If nothing matches yet the gateway is created in a Pending/awaiting-placement
# state and binds when a matching cluster appears -- a wrong selector is
# recoverable, a wrong cluster_id is not.
#
# Placement is mapped at CREATE only and is NOT exposed on the Gateway read
# surface, so a later import can never change it. Getting this wrong means
# deleting the gateway and recreating it.
#
# This file carries the prod identity (rosa-agent). The integration and
# staging overlays patch metadata.name; prod uses it as-is. Never apply this
# base directly -- always apply an overlay.
#
# No metadata.description. `hsctl apply` copies metadata.description into the
# request body verbatim, and GatewayCreateRequest has no such field, so the
# API rejects the whole apply with
#   400 ... Invalid request format: json: unknown field "description"
# The import writer ignores the field instead, so this is one of the few
# places the two apply paths genuinely differ. Of every create request in the
# API only the gateway service account accepts a description. Describe the
# gateway in a comment here, not in metadata.
apiVersion: hypershell.redhat.io/v1
kind: Gateway
metadata:
  name: rosa-agent
spec:
  # Deliberately the same two labels the hypershell reference tree uses for
  # its own agents, and deliberately no more.
  #
  # hyp0 and hyp1 are the HyperShell team's own integration and staging tiers,
  # so rosa-agent should get whatever those tiers offer rather than steering
  # around their topology -- narrowing the selector would mean testing against
  # a configuration nobody else runs.
  #
  # Two consequences, both accepted:
  #
  #   - Which cluster a gateway lands on is the control plane's choice when
  #     several match, and may differ between instances and between
  #     recreates. Observed 2026-10-22: hyp0 has three matching clusters and
  #     chose a kata one; hyp2 has three and chose a non-kata one; hyp1 has
  #     exactly one (its hub). That variation is the platform behaviour we
  #     want to experience, not paper over.
  #   - runtime/kata is available on hyp0 and hyp2 but not hyp1, so it could
  #     never be uniform here anyway. rosa-agent does not require it.
  #
  # gateway-version is not pinned: only hyp0-spoke0 advertises one and it is
  # provider/aws, so a version selector cannot be satisfied anywhere in this
  # fleet. Gateways are not upgradeable in place -- see
  # docs/hypershell-gateways.md for the delete-and-recreate procedure a new
  # release requires.
  placement:
    selector:
      - provider/ibm
      - network/public
  # Edge termination. The gateway is never declared insecure here.
  tls_mode: edge
  # External exposure. Without this the gateway still provisions and reports
  # Running/Healthy, but it is unreachable: `isRoutedGateway` short-circuits on
  # a nil route, so the control plane never resolves an address and
  # route_address/console_address stay empty. Running means the workload is
  # healthy, not that anyone can connect to it.
  #
  # This is a JSON-encoded STRING, not a nested mapping. The import writer
  # reads it with specString, so a YAML mapping here is silently dropped.
  # RouteConfig is {host, enabled}; a non-empty object defaults to enabled, so
  # '{}' would also work, but the explicit form documents intent.
  route: '{"enabled": true}'
