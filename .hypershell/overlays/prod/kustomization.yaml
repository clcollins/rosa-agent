apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Production -- hyp2.
#
# No patch: the base already carries the prod identity (rosa-agent), so this
# overlay is a pass-through. It exists rather than having prod point at the
# base directly so that all three environments are applied the same way --
# `hsctl apply -k .hypershell/overlays/<env>` -- and so prod has somewhere
# obvious to put a patch the first time it needs one.
resources:
  - ../../base/platform
